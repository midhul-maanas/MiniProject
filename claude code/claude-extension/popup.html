<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbon Footprint Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Carbon Footprint</h1>
      <p class="subtitle">Your digital environmental impact</p>
    </header>
    
    <div id="summary" class="summary-card">
      <div class="metric">
        <span class="label">Total CO₂</span>
        <span class="value" id="totalCO2">0.00 kg</span>
      </div>
      <div class="metric">
        <span class="label">Status</span>
        <span class="badge" id="status">Low</span>
      </div>
    </div>
    
    <div class="stats">
      <h2>Activity Breakdown</h2>
      <div id="activityList" class="activity-list">
        <p class="no-data">No activity data yet</p>
      </div>
    </div>
    
    <div class="actions">
      <button id="viewDashboard" class="btn-primary">View Full Dashboard</button>
      <button id="resetData" class="btn-secondary">Reset Data</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
